<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeBot · Now Playing (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d11;
    --panel:#15161d;
    --ink:#f3ead6;        /* cream */
    --coral:#ee7b6a;      /* the pig */
    --mint:#8fd9a8;       /* the little leaf */
    --dim:#6a6e7e;
    --vinyl:#0a0a0c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(circle at 50% 20%, #1a1c26 0%, var(--bg) 60%),
      var(--bg);
    color:var(--ink);
    font-family:'VT323', monospace;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:32px;
    overflow:hidden;
  }
  /* halftone dot texture echoing the pig artwork */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.4px);
    background-size:14px 14px;
    mask-image:radial-gradient(circle at 50% 45%, transparent 30%, #000 85%);
    opacity:.5;
  }
  /* scanline / crt grain */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;opacity:.35;
  }

  .card{
    position:relative;z-index:1;
    width:560px;max-width:100%;
    background:linear-gradient(160deg, #191b24, var(--panel));
    border:2px solid #2a2d3a;
    border-radius:18px;
    padding:26px 26px 22px;
    display:grid;grid-template-columns:170px 1fr;gap:24px;
    box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
  }

  /* ---- turntable ---- */
  .deck{position:relative;width:170px;height:170px;align-self:center;}
  .platter{
    position:absolute;inset:0;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #141414 0 2px, #0a0a0c 2px 4px),
      var(--vinyl);
    box-shadow:0 8px 24px rgba(0,0,0,.6), inset 0 0 0 6px #050506, inset 0 0 40px rgba(0,0,0,.8);
    animation:spin 4.5s linear infinite;
  }
  /* glossy sheen sweeping the record */
  .platter::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.10) 48%, transparent 56%);
  }
  .label{
    position:absolute;top:50%;left:50%;width:74px;height:74px;margin:-37px 0 0 -37px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 35%, #ff9d8c, var(--coral));
    border:3px solid #101116;
    display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .label .hole{position:absolute;width:8px;height:8px;border-radius:50%;background:#101116;}
  .tonearm{
    position:absolute;top:-6px;right:-6px;width:96px;height:96px;transform-origin:88% 12%;
    transform:rotate(-28deg);transition:transform .5s ease;
  }
  .paused .platter{animation-play-state:paused;}
  .paused .tonearm{transform:rotate(-46deg);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- info ---- */
  .info{display:flex;flex-direction:column;justify-content:center;min-width:0;}
  .nowtag{
    font-family:'Press Start 2P';font-size:9px;letter-spacing:1px;color:var(--mint);
    display:flex;align-items:center;gap:8px;margin-bottom:12px;text-transform:uppercase;
  }
  .rec{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 8px var(--coral);animation:blink 1.1s steps(1) infinite;}
  .paused .rec{animation:none;background:var(--dim);box-shadow:none;}
  @keyframes blink{50%{opacity:.25;}}

  .title-wrap{overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);}
  .title{display:inline-block;font-size:34px;line-height:1.05;color:var(--ink);text-shadow:0 0 14px rgba(238,123,106,.25);padding-left:100%;animation:marquee 11s linear infinite;}
  .paused .title{animation-play-state:paused;}
  @keyframes marquee{to{transform:translateX(-100%);}}
  .channel{font-size:20px;color:var(--dim);margin-top:2px;}

  /* progress */
  .bar{margin-top:16px;height:8px;border-radius:6px;background:#23252f;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);}
  .fill{height:100%;width:34%;border-radius:6px;background:linear-gradient(90deg,var(--coral),#ffb59f);box-shadow:0 0 12px rgba(238,123,106,.6);}
  .times{display:flex;justify-content:space-between;font-size:18px;color:var(--dim);margin-top:5px;}

  /* equalizer + pig row */
  .footer{grid-column:1 / -1;display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;height:54px;}
  .eq{display:flex;align-items:flex-end;gap:5px;height:44px;}
  .eq i{width:7px;background:linear-gradient(var(--mint),#cdebd6);border-radius:3px 3px 0 0;height:30%;animation:bounce .7s ease-in-out infinite;}
  .eq i:nth-child(2){animation-delay:.15s;} .eq i:nth-child(3){animation-delay:.3s;}
  .eq i:nth-child(4){animation-delay:.45s;} .eq i:nth-child(5){animation-delay:.6s;}
  .eq i:nth-child(6){animation-delay:.2s;} .eq i:nth-child(7){animation-delay:.5s;}
  .paused .eq i{animation-play-state:paused;height:18%;}
  @keyframes bounce{0%,100%{height:22%;}50%{height:100%;}}

  /* the chef pig — bounces to the beat, sleeps when paused */
  .pig{transform-origin:50% 100%;animation:hop .7s ease-in-out infinite;}
  .paused .pig{animation:none;}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(0);}30%{transform:translateY(-9px) rotate(-3deg);}60%{transform:translateY(0) rotate(2deg);}}
  .zzz{font-family:'Press Start 2P';font-size:8px;color:var(--dim);opacity:0;margin-left:6px;}
  .paused .zzz{opacity:1;}

  .controls{position:absolute;top:14px;right:16px;}
  .btn{font-family:'Press Start 2P';font-size:9px;background:#23252f;color:var(--ink);border:2px solid #333645;border-radius:8px;padding:8px 10px;cursor:pointer;}
  .btn:hover{border-color:var(--coral);color:var(--coral);}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:16px;color:#3f4250;z-index:6;}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="controls"><button class="btn" id="toggle">⏸ PAUSE</button></div>

    <div class="deck">
      <div class="platter">
        <div class="label">
          <!-- tiny pig on the record label -->
          <svg width="42" height="36" viewBox="0 0 28 24" shape-rendering="crispEdges" aria-hidden="true">
            <g>
              <rect x="9"  y="1" width="10" height="3" fill="#fff"/>
              <rect x="7"  y="3" width="14" height="3" fill="#fff"/>
              <rect x="6"  y="6" width="16" height="11" fill="#101116"/>
              <rect x="7"  y="7" width="14" height="9"  fill="#e07a63"/>
              <rect x="10" y="10" width="2" height="2" fill="#101116"/>
              <rect x="16" y="10" width="2" height="2" fill="#101116"/>
              <rect x="11" y="13" width="6" height="3" fill="#cf6a55"/>
              <rect x="12" y="14" width="1" height="1" fill="#101116"/>
              <rect x="15" y="14" width="1" height="1" fill="#101116"/>
            </g>
          </svg>
          <span class="hole"></span>
        </div>
      </div>
      <svg class="tonearm" viewBox="0 0 96 96" aria-hidden="true">
        <circle cx="84" cy="12" r="9" fill="#2b2e3a" stroke="#3b3f4d" stroke-width="2"/>
        <rect x="80" y="12" width="8" height="60" rx="3" transform="rotate(34 84 12)" fill="#caced9"/>
        <rect x="40" y="64" width="14" height="8" rx="2" fill="#3b3f4d"/>
      </svg>
    </div>

    <div class="info">
      <div class="nowtag"><span class="rec"></span> Now Playing</div>
      <div class="title-wrap"><span class="title" id="title">Gummy B - ALL WELL (Official Pixel Loop)</span></div>
      <div class="channel" id="channel">♪ chillhop · 派發中心 DESKTOP-98LJSFA</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="times"><span id="cur">1:18</span><span id="dur">4:27</span></div>
    </div>

  </div>

  <div class="hint">mockup · 假資料 · 點右上角切換 播放/暫停 看狀態 · 之後接真實 CDP now-playing 資料</div>

<script>
  // --- fake "live" playback so the mockup feels alive ---
  let cur = 78, dur = 267, playing = true;
  const fmt = s => (s<0?0:Math.floor(s/60)) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  const fill = document.getElementById('fill');
  const curEl = document.getElementById('cur');
  const card = document.getElementById('card');
  const btn = document.getElementById('toggle');

  function render(){
    fill.style.width = (cur/dur*100).toFixed(1) + '%';
    curEl.textContent = fmt(cur);
  }
  setInterval(()=>{ if(playing){ cur = (cur+1) % dur; render(); } }, 1000);

  btn.addEventListener('click', ()=>{
    playing = !playing;
    card.classList.toggle('paused', !playing);
    btn.textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
  });
  render();
</script>
</body>
</html>
