<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https:">
  <title>ClaudeBot Chat</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-title">CLAUDEBOT</span>
    </div>
    <div class="titlebar-status">
      <span class="status-dot disconnected" id="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <button id="btn-project" class="titlebar-btn project-btn" title="Select Project">
      <span id="project-label">No Project</span>
    </button>
    <div class="titlebar-controls">
      <button id="btn-reconnect" class="titlebar-btn" title="重新連線 / 換伺服器">&#x21BB;</button>
      <button id="btn-pin" class="titlebar-btn" title="Always on Top">&#x1F4CC;</button>
      <button id="btn-compact" class="titlebar-btn" title="Compact Mode">&#x25FB;</button>
      <button id="btn-minimize" class="titlebar-btn">&#x2500;</button>
      <button id="btn-close" class="titlebar-btn close">&#x2715;</button>
    </div>
  </div>

  <!-- Project panel (hidden by default, anchored below titlebar) -->
  <div id="project-panel" class="project-panel hidden">
    <div class="project-panel-row">
      <input type="text" id="project-path-input" placeholder="Paste project path..." autocomplete="off" spellcheck="false">
      <button id="btn-project-go" class="btn-project-go">GO</button>
    </div>
    <button id="btn-browse-projects" class="btn-browse">Browse Projects</button>
    <span class="project-hint">/setbase &lt;path&gt; to change browse folder</span>
  </div>

  <!-- Connection panel (shown when disconnected) -->
  <div class="connect-panel" id="connect-panel">
    <div class="form-group">
      <label for="pair-url">Server（從 /pair 複製，每次可能不同）</label>
      <input type="text" id="pair-url" placeholder="貼上 /pair 給的 Server 網址" autocomplete="off" spellcheck="false">
    </div>
    <div class="form-group">
      <label for="pair-code">配對碼（同樣從 /pair 複製）</label>
      <input type="text" id="pair-code" placeholder="Pairing code (8 碼)" maxlength="8" autocomplete="off" spellcheck="false">
    </div>
    <button id="btn-pair" class="btn-primary">Connect</button>

    <div class="connect-divider"><span>or</span></div>

    <div class="form-group">
      <label for="license-key">License Key</label>
      <input type="text" id="license-key" placeholder="CB-XXXX-XXXX-XXXX" maxlength="16" autocomplete="off" spellcheck="false">
    </div>
    <div id="license-error" class="license-error hidden"></div>
    <button id="btn-activate" class="btn-secondary">Activate</button>
  </div>

  <!-- Chat panel (shown when connected) -->
  <div class="chat-panel hidden" id="chat-panel">
    <div class="messages" id="messages"></div>

    <div class="typing-indicator hidden" id="typing-indicator">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <div class="input-bar">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button id="btn-mic" title="語音輸入（點一下開始/停止）">&#x1F3A4;</button>
      <button id="btn-send">SEND</button>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="purify.min.js"></script>
  <script src="chat-renderer.js"></script>
</body>
</html>
