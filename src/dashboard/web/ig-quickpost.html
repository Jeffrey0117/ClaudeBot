<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IG 快速發文</title>
<style>
  :root {
    --bg: #0f1117; --card: #1a1d27; --card2: #232736;
    --text: #e8eaf0; --dim: #8a91a5; --accent: #e1306c;
    --accent2: #f77737; --ok: #2ecc71; --err: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    padding: 16px 14px calc(28px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; font-size: 15px;
  }
  h1 { font-size: 20px; margin-bottom: 14px; }
  h1 .grad { background: linear-gradient(45deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .section { margin-bottom: 18px; }
  .label { color: var(--dim); font-size: 12px; font-weight: 700; letter-spacing: .5px; margin-bottom: 8px; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 8px 14px; border-radius: 999px; font-size: 13px;
    background: var(--card); color: var(--dim); border: 1px solid #2a2f40; cursor: pointer; white-space: nowrap;
  }
  .tab.active { background: linear-gradient(45deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; font-weight: 700; }

  .vlist { background: var(--card); border-radius: 14px; overflow: hidden; max-height: 42vh; overflow-y: auto; }
  .vitem {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border-bottom: 1px solid #242938; cursor: pointer;
  }
  .vitem:last-child { border-bottom: none; }
  .vitem.sel { background: rgba(225,48,108,.14); box-shadow: inset 3px 0 0 var(--accent); }
  .vitem .icon { font-size: 20px; flex: 0 0 auto; }
  .vitem .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .vitem .sz { color: var(--dim); font-size: 12px; flex: 0 0 auto; }
  .empty { padding: 22px; text-align: center; color: var(--dim); }

  .upbtn {
    display: block; width: 100%; text-align: center; padding: 11px; border-radius: 12px;
    border: 1.5px dashed #3a4156; color: var(--dim); font-size: 14px; cursor: pointer; background: transparent;
    margin-top: 8px; font-family: inherit;
  }
  .upprog { height: 6px; border-radius: 3px; background: var(--card2); margin-top: 8px; overflow: hidden; display: none; }
  .upprog > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }

  textarea {
    width: 100%; min-height: 110px; background: var(--card); color: var(--text);
    border: 1px solid #2a2f40; border-radius: 14px; padding: 12px 14px; font-size: 15px;
    font-family: inherit; resize: vertical; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
    background: var(--card2); font-size: 13px; cursor: pointer; border: 1px solid #2f3548; color: var(--text);
    font-family: inherit;
  }
  .chip .x { color: var(--dim); font-size: 14px; padding: 0 2px; }
  .chip.add { color: var(--dim); border-style: dashed; }

  .actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn {
    flex: 1; padding: 15px; border: none; border-radius: 14px; font-size: 16px; font-weight: 800;
    cursor: pointer; color: #fff; font-family: inherit;
  }
  .btn:disabled { opacity: .45; }
  .btn.go { background: linear-gradient(45deg, var(--accent), var(--accent2)); }
  .btn.sched { background: var(--card2); border: 1px solid #2f3548; flex: 0 0 30%; }
  .schedrow { display: none; gap: 10px; margin-top: 10px; }
  .schedrow.show { display: flex; }
  .schedrow input { flex: 1; background: var(--card); color: var(--text); border: 1px solid #2a2f40; border-radius: 12px; padding: 11px; font-family: inherit; font-size: 14px; }
  .schedrow .btn { flex: 0 0 32%; padding: 11px; font-size: 14px; }

  #status { margin-top: 14px; padding: 13px 15px; border-radius: 12px; font-size: 14px; display: none; line-height: 1.55; }
  #status.show { display: block; }
  #status.run { background: rgba(247,119,55,.12); border-left: 3px solid var(--accent2); }
  #status.ok  { background: rgba(46,204,113,.12); border-left: 3px solid var(--ok); }
  #status.err { background: rgba(239,68,68,.12);  border-left: 3px solid var(--err); }

  .qlist { background: var(--card); border-radius: 14px; overflow: hidden; }
  .qitem { padding: 10px 14px; border-bottom: 1px solid #242938; font-size: 13px; color: var(--dim); }
  .qitem b { color: var(--text); font-weight: 600; }
  .qitem:last-child { border-bottom: none; }

  #gate {
    position: fixed; inset: 0; background: var(--bg); z-index: 99;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px;
  }
  #gate.hidden { display: none; }
  #gate input {
    width: 100%; max-width: 300px; background: var(--card); color: var(--text); text-align: center;
    border: 1px solid #2a2f40; border-radius: 12px; padding: 14px; font-size: 18px; letter-spacing: 3px;
    font-family: inherit;
  }
  #gate .btn { flex: none; padding: 13px 40px; }
</style>
</head>
<body>

<div id="gate">
  <div style="font-size:42px">🔐</div>
  <div style="color:var(--dim)">輸入 PIN 進入快速發文</div>
  <input id="pin" type="password" autocomplete="off" placeholder="PIN">
  <button class="btn go" onclick="enter()">進入</button>
  <div id="gateerr" style="color:var(--err);font-size:13px"></div>
</div>

<h1>⚡ <span class="grad">IG 快速發文</span></h1>

<div class="section">
  <div class="label">🎬 選影片</div>
  <div class="tabs" id="tabs"></div>
  <div class="vlist" id="vlist"><div class="empty">載入中…</div></div>
  <button class="upbtn" onclick="document.getElementById('file').click()">＋ 從手機上傳影片</button>
  <input id="file" type="file" accept="video/*,image/*" style="display:none" onchange="upload(this.files[0])">
  <div class="upprog" id="upprog"><div></div></div>
</div>

<div class="section">
  <div class="label">✏️ 文案</div>
  <textarea id="caption" placeholder="寫點什麼…  #hashtag"></textarea>
  <div class="chips" id="chips"></div>
</div>

<div class="actions">
  <button class="btn go" id="postBtn" onclick="post()">🚀 立即發</button>
  <button class="btn sched" onclick="toggleSched()">⏰ 排程</button>
</div>
<div class="schedrow" id="schedrow">
  <input id="when" type="datetime-local">
  <button class="btn go" onclick="schedule()">排定</button>
</div>

<div id="status"></div>

<div class="section" style="margin-top:20px">
  <div class="label">📋 待發排程</div>
  <div class="qlist" id="queue"><div class="empty">無</div></div>
</div>

<script>
'use strict';
let TOKEN = localStorage.getItem('igtoken') || '';
let curDir = '';
let selected = null; // { dir, name }

const $ = id => document.getElementById(id);

function api(path, opts = {}) {
  opts.headers = Object.assign({ 'x-ig-token': TOKEN }, opts.headers || {});
  return fetch('/api/' + path, opts).then(async r => {
    if (r.status === 401) { localStorage.removeItem('igtoken'); $('gate').classList.remove('hidden'); throw new Error('PIN 錯誤'); }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  });
}

async function enter() {
  TOKEN = $('pin').value.trim();
  try {
    await api('templates');
    localStorage.setItem('igtoken', TOKEN);
    $('gate').classList.add('hidden');
    init();
  } catch (e) {
    $('gateerr').textContent = e.message;
  }
}

// --- Videos ---

async function loadDir(dir) {
  curDir = dir;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.dir === dir));
  $('vlist').innerHTML = '<div class="empty">載入中…</div>';
  try {
    const d = await api('videos?dir=' + encodeURIComponent(dir));
    renderTabs(dir === '' ? d.dirs : null);
    if (!d.files.length) { $('vlist').innerHTML = '<div class="empty">這層沒有影片</div>'; return }
    $('vlist').innerHTML = '';
    for (const f of d.files) {
      const el = document.createElement('div');
      el.className = 'vitem';
      el.innerHTML = '<span class="icon">🎬</span><span class="nm"></span><span class="sz"></span>';
      el.querySelector('.nm').textContent = f.name;
      el.querySelector('.sz').textContent = (f.size / 1048576).toFixed(1) + 'MB';
      el.onclick = () => {
        selected = { dir, name: f.name };
        document.querySelectorAll('.vitem').forEach(v => v.classList.remove('sel'));
        el.classList.add('sel');
      };
      $('vlist').appendChild(el);
    }
  } catch (e) {
    $('vlist').innerHTML = '<div class="empty">' + e.message + '</div>';
  }
}

let rootDirs = null;
function renderTabs(dirs) {
  if (dirs) rootDirs = dirs;
  if (!rootDirs) return;
  const tabs = $('tabs');
  tabs.innerHTML = '';
  const mk = (label, dir) => {
    const t = document.createElement('div');
    t.className = 'tab' + (dir === curDir ? ' active' : '');
    t.dataset.dir = dir;
    t.textContent = label;
    t.onclick = () => loadDir(dir);
    tabs.appendChild(t);
  };
  mk('根目錄', '');
  for (const d of rootDirs) {
    mk(d, d);
    if (d === 'IG短片') mk('西譯社', 'IG短片/西譯社短片');
  }
}

function fullPath() {
  if (!selected) return null;
  return selected.dir ? selected.dir + '/' + selected.name : selected.name;
}

// --- Upload ---

function upload(file) {
  if (!file) return;
  const prog = $('upprog');
  prog.style.display = 'block';
  const bar = prog.firstElementChild;
  const xhr = new XMLHttpRequest();
  xhr.open('PUT', '/api/upload?name=' + encodeURIComponent(file.name));
  xhr.setRequestHeader('x-ig-token', TOKEN);
  xhr.upload.onprogress = e => { if (e.lengthComputable) bar.style.width = (e.loaded / e.total * 100) + '%'; };
  xhr.onload = () => {
    prog.style.display = 'none'; bar.style.width = '0%';
    if (xhr.status >= 200 && xhr.status < 300) {
      const d = JSON.parse(xhr.responseText);
      selected = { dir: '上傳', name: d.saved.split('/').pop() };
      setStatus('ok', '✅ 已上傳 ' + file.name + '，已自動選取');
      loadDir('上傳');
    } else {
      setStatus('err', '❌ 上傳失敗: ' + xhr.responseText);
    }
  };
  xhr.onerror = () => { prog.style.display = 'none'; setStatus('err', '❌ 上傳連線失敗'); };
  xhr.send(file);
}

// --- Templates ---

async function loadTemplates() {
  const d = await api('templates');
  const chips = $('chips');
  chips.innerHTML = '';
  for (const t of d.templates) {
    const c = document.createElement('button');
    c.className = 'chip';
    c.innerHTML = '<span></span><span class="x">✕</span>';
    c.firstElementChild.textContent = t.name;
    c.firstElementChild.onclick = e => { e.stopPropagation(); $('caption').value = t.content; };
    c.onclick = () => { $('caption').value = t.content; };
    c.querySelector('.x').onclick = async e => {
      e.stopPropagation();
      if (!confirm('刪除模板「' + t.name + '」?')) return;
      await api('templates?name=' + encodeURIComponent(t.name), { method: 'DELETE' });
      loadTemplates();
    };
    chips.appendChild(c);
  }
  const add = document.createElement('button');
  add.className = 'chip add';
  add.textContent = '＋ 存成模板';
  add.onclick = async () => {
    const content = $('caption').value.trim();
    if (!content) { alert('文案是空的'); return }
    const name = prompt('模板名稱:');
    if (!name) return;
    await api('templates', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, content }) });
    loadTemplates();
  };
  chips.appendChild(add);
}

// --- Post / Schedule ---

function setStatus(kind, msg) {
  const s = $('status');
  s.className = 'show ' + kind;
  s.textContent = msg;
}

async function post() {
  const filename = fullPath();
  const caption = $('caption').value.trim();
  if (!filename) { setStatus('err', '❌ 先選一支影片'); return }
  if (!caption) { setStatus('err', '❌ 文案不能是空的'); return }

  $('postBtn').disabled = true;
  setStatus('run', '📤 發文中… 傳檔 → 遠端 Chrome 操作 IG，最多約 3 分鐘');
  try {
    const d = await api('post', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ filename, caption }) });
    const t0 = Date.now();
    const poll = setInterval(async () => {
      try {
        const j = (await api('job?id=' + d.jobId)).job;
        if (j.status === 'running') {
          setStatus('run', '📤 發文中… 已 ' + Math.round((Date.now() - t0) / 1000) + 's');
          return;
        }
        clearInterval(poll);
        $('postBtn').disabled = false;
        if (j.status === 'done') {
          setStatus('ok', '✅ 發文成功！⏱ ' + (j.result?.duration_s ?? 0).toFixed(0) + 's');
        } else {
          setStatus('err', '❌ 失敗: ' + (j.result?.error || '?') + (j.result?.step ? '（步驟 ' + j.result.step + '）' : ''));
        }
      } catch (_) { /* transient poll error — keep polling */ }
    }, 3000);
  } catch (e) {
    $('postBtn').disabled = false;
    setStatus('err', '❌ ' + e.message);
  }
}

function toggleSched() {
  const row = $('schedrow');
  row.classList.toggle('show');
  if (!$('when').value) {
    const d = new Date(Date.now() + 3600_000);
    d.setMinutes(0, 0, 0);
    $('when').value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + 'T' + String(d.getHours()).padStart(2, '0') + ':00';
  }
}

async function schedule() {
  const filename = fullPath();
  const caption = $('caption').value.trim();
  const datetime = $('when').value;
  if (!filename) { setStatus('err', '❌ 先選一支影片'); return }
  if (!caption) { setStatus('err', '❌ 文案不能是空的'); return }
  if (!datetime) { setStatus('err', '❌ 選個時間'); return }
  try {
    await api('schedule', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ datetime, filename, caption }) });
    setStatus('ok', '✅ 已排程 ' + datetime.replace('T', ' '));
    $('schedrow').classList.remove('show');
    loadQueue();
  } catch (e) {
    setStatus('err', '❌ ' + e.message);
  }
}

async function loadQueue() {
  try {
    const d = await api('schedule');
    const q = $('queue');
    if (!d.schedule.length) { q.innerHTML = '<div class="empty">無</div>'; return }
    q.innerHTML = '';
    for (const e of d.schedule) {
      const el = document.createElement('div');
      el.className = 'qitem';
      el.innerHTML = '<b></b><br>';
      el.querySelector('b').textContent = e.datetime.replace('T', ' ');
      el.appendChild(document.createTextNode(e.filename.split('/').pop() + ' — ' + e.caption.slice(0, 30)));
      q.appendChild(el);
    }
  } catch (_) { /* ignore */ }
}

// --- Init ---

function init() {
  loadDir('');
  loadTemplates();
  loadQueue();
}

if (TOKEN) {
  api('templates')
    .then(() => { $('gate').classList.add('hidden'); init(); })
    .catch(() => { /* gate stays */ });
}
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
</script>
</body>
</html>
